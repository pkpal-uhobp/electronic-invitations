{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Учебная система электронных приглашений — Django ПР6">
  <title>{% block title %}{{ page_title|default:"Главная" }} — Электронные приглашения{% endblock %}</title>
  <link rel="icon" href="{% static 'homepage/img/logo.png' %}" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
  {% include 'includes/navigation.html' %}
  <main class="container main-content" id="main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer-bar">
    <div class="container footer-inner">
      <span>© <span id="current-year">2026</span> Электронные приглашения · ПР6</span>
      <span>Учебный проект · Django Templates</span>
    </div>
  </footer>
  <script src="{% static 'homepage/js/main.js' %}" defer></script>
</body>
</html>
