{% if invitation.status == 'cancelled' %}
<span class="status-pill status-muted invitation-status">Отменено</span>
{% elif invitation.status == 'completed' %}
<span class="status-pill status-muted invitation-status">Завершено</span>
{% else %}
<span class="status-pill status-active invitation-status">Активно</span>
{% endif %}
